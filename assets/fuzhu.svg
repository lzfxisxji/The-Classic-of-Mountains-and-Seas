<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 440" role="img" aria-label="夫诸 原创档案原画">
  <defs>
    <pattern id="grid-fz" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 H0 V34" fill="none" stroke="rgba(237,189,121,0.06)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow-fz" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#3f8a78" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3f8a78" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="340" height="440" fill="#0b0809"/>
  <rect width="340" height="440" fill="url(#grid-fz)"/>
  <rect width="340" height="440" fill="url(#glow-fz)"/>

  <!-- 切角金框 -->
  <path d="M28 14 H312 L326 28 V412 L312 426 H28 L14 412 V28 Z"
        fill="none" stroke="#edbd79" stroke-width="2" stroke-opacity="0.85"/>

  <!-- 夫诸 · 四角白鹿 -->
  <g fill="none" stroke="#edbd79" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- 身体 -->
    <path d="M118 256 C112 236 124 220 150 218 C176 216 196 228 198 250
             C200 270 186 284 160 284 C138 284 124 272 118 256 Z"/>
    <!-- 颈 -->
    <path d="M150 222 C146 200 150 180 162 166"/>
    <!-- 头 -->
    <path d="M156 158 C148 152 148 142 158 138 C170 134 182 142 182 154
             C182 166 172 172 162 168 C158 166 156 162 158 158 Z"/>
    <!-- 鼻 -->
    <path d="M182 152 L192 150"/>
    <!-- 四角（头两侧各两尖） -->
    <path d="M160 142 C152 126 150 116 156 104 M156 104 C150 110 150 118 156 122"/>
    <path d="M166 140 C160 122 162 110 172 102 M172 102 C166 110 168 120 174 124"/>
    <path d="M170 140 C178 124 184 114 196 110 M196 110 C188 116 188 126 192 130"/>
    <path d="M174 142 C184 128 194 122 206 122 M206 122 C198 126 196 134 200 138"/>
    <!-- 四肢（温驯直立） -->
    <path d="M132 282 L130 322 L124 334 M130 322 L138 334"/>
    <path d="M150 284 L150 324 L144 336 M150 324 L158 336"/>
    <path d="M170 284 L172 322 L166 334 M172 322 L180 334"/>
    <path d="M188 280 L192 318 L186 330 M192 318 L200 330"/>
    <!-- 短尾 -->
    <path d="M118 252 C108 254 104 262 108 270"/>
  </g>

  <!-- 大水兆 · 脚下水波 -->
  <g fill="none" stroke="#3f8a78" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M96 348 C112 340 128 356 144 348 C160 340 176 356 192 348
             C208 340 224 356 240 348 C256 340 272 356 288 348"/>
    <path d="M104 362 C120 354 136 370 152 362 C168 354 184 370 200 362
             C216 354 232 370 248 362 C264 354 280 370 296 362"/>
  </g>

  <!-- 标题印章 -->
  <text x="170" y="404" text-anchor="middle" fill="#edbd79"
        font-family="'Noto Serif SC', serif" font-size="20" letter-spacing="6">夫 诸</text>
  <text x="170" y="420" text-anchor="middle" fill="rgba(237,189,121,0.55)"
        font-family="'DM Mono', monospace" font-size="8" letter-spacing="2">FUZHU · 水兆</text>
</svg>
